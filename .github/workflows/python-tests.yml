name: Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked runtime and testing dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-dev.txt
      - name: Byte-compile sources
        run: python -m compileall -q backend.py verifai_core scripts
      - name: Run offline regression suite
        run: python -m pytest -q
