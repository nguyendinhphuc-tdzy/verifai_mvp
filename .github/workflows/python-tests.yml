name: Python tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and testing dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run offline regression suite
        env:
          VLM_ENABLED: '0'
          OCR_ENABLED: '0'
          ASR_ENABLED: '0'
        run: python -m pytest -q
